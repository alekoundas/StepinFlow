<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/logo.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>StepinFlow</title>
    <!-- A style attribute cannot hold these, and the app's CSS has not loaded yet. -->
    <style>
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes startup-appear {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-spinner {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; min-height: 100vh">
    <!--
      The main window's first paint, until BackendGateComponent removes it. It needs no bundle, theme
      or backend, so its colours are written out: the window's background and the theme's primary.
    -->
    <div
      id="startup-screen"
      role="status"
      style="
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #121212;
        color: rgba(255, 255, 255, 0.87);
        font-family: system-ui, sans-serif;
      "
    >
      <div style="display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600">
        <img
          src="/logo.svg"
          width="32"
          height="32"
          alt=""
        />
        StepinFlow
      </div>
      <div
        id="startup-spinner"
        aria-hidden="true"
        style="
          box-sizing: border-box;
          width: 20px;
          height: 20px;
          border: 2px solid rgba(255, 255, 255, 0.15);
          border-top-color: #818cf8;
          border-radius: 50%;
          animation: startup-spin 0.9s linear infinite;
        "
      ></div>
      <div style="font-size: 14px; color: rgba(255, 255, 255, 0.6)">Starting…</div>
      <div style="font-size: 13px; color: rgba(255, 255, 255, 0.6); opacity: 0; animation: startup-appear 0.3s 8s forwards">
        This can take longer after an update.
      </div>
    </div>
    <script>
      // The overlay, the image editor and the recording bar load this page too, and most of them are transparent.
      if (!/^#\/(overlay-|image-editor|recording-bar)/.test(location.hash))
        document.getElementById("startup-screen").style.display = "flex";
    </script>

    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
