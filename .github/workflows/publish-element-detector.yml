name: Publish element detector

# OmniParser v2's icon_detect_v3 (MIT, Copyright Microsoft), the model that finds the element under a
# recorded click, in a release of the app's own. The build downloads it (scripts/download-models.mjs).
# Run once; a new model means a new tag, and the download script pointing at it.
#
# Microsoft ships it as TorchScript, so it is exported to ONNX here and the copy checked against the
# original before anything is published. The earlier icon_detect is AGPL-3.0, inherited from
# Ultralytics, and is not used.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. A new model means a new tag - element-detector-v2, element-detector-v3."
        required: true
        default: "element-detector-v1"

permissions:
  contents: write

env:
  REPO: microsoft/OmniParser-v2.0
  # A commit, not 'main': the author can push new bytes to a branch.
  REVISION: f55d0750e5b94db2125ef0b45b0fa4a85ddc59b4
  WEIGHTS_SHA: 11c6cbb77f22569fab22d86c76407a83ec81ab89dbfe28279854822d6e3fb00c
  LICENSE_SHA: 646f8936b8ddcd14e13e578ff6857e368780b0d1a4f6066bee89211923a373e2
  TORCH: 2.8.0
  # The app's, so the check reads the copy the way the app will.
  ONNXRUNTIME: 1.31.0

jobs:
  publish:
    # Pinned rather than latest: the image decides the Python, and the Python which PyTorch wheels exist.
    runs-on: ubuntu-24.04

    steps:
      # The point of a tag is that it always serves the same bytes, so a build from March and one
      # from December resolve identically. Overwriting one would lose that silently.
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ inputs.tag }} already exists. Use a new tag."
            exit 1
          fi

      # --fail so an error page is never written to disk as a model.
      - name: Download the weights from HuggingFace
        run: |
          mkdir -p weights detector
          base="https://huggingface.co/$REPO/resolve/$REVISION/icon_detect_v3"

          curl --fail --location --show-error --silent -o weights/model.pt "$base/model.pt"
          curl --fail --location --show-error --silent -o weights/LICENSE "$base/LICENSE"

          echo "$WEIGHTS_SHA  weights/model.pt" | sha256sum --check --strict
          echo "$LICENSE_SHA  weights/LICENSE" | sha256sum --check --strict

      - name: Install PyTorch and ONNX Runtime
        run: |
          pip install --quiet "torch==$TORCH" --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "onnxruntime==$ONNXRUNTIME" numpy

      # dynamo=False is the exporter that reads TorchScript. Opset 17 is what the app's ONNX Runtime
      # reads. The height and width may vary, so a screenshot is read at its own size. The outputs
      # are a score and four distances for each of the three grids, of 8, 16 and 32 pixels, which
      # ElementDetector decodes.
      - name: Export to ONNX
        run: |
          python - <<'PY'
          import torch

          model = torch.jit.load("weights/model.pt", map_location="cpu").eval()
          image = torch.zeros(1, 3, 640, 640)

          torch.onnx.export(
              model,
              (image,),
              "detector/element-detector.onnx",
              dynamo=False,
              opset_version=17,
              input_names=["images"],
              output_names=["scores_8", "distances_8", "scores_16", "distances_16", "scores_32", "distances_32"],
              dynamic_axes={
                  "images": {2: "height", 3: "width"},
                  "scores_8": {2: "rows_8", 3: "columns_8"},
                  "distances_8": {2: "rows_8", 3: "columns_8"},
                  "scores_16": {2: "rows_16", 3: "columns_16"},
                  "distances_16": {2: "rows_16", 3: "columns_16"},
                  "scores_32": {2: "rows_32", 3: "columns_32"},
                  "distances_32": {2: "rows_32", 3: "columns_32"},
              },
          )
          print("written detector/element-detector.onnx")
          PY

      # The same random screenshot through PyTorch and through the copy, at 640 and at a full-HD
      # size (1080 rounded up to the 32 the grids need). An operation converted wrongly shows as a
      # large difference; float rounding stays far under a thousandth of the largest value.
      - name: Check the copy against the original
        run: |
          python - <<'PY'
          import sys, time
          import numpy, onnxruntime, torch

          def flatten(value):
              if isinstance(value, (list, tuple)):
                  return [leaf for item in value for leaf in flatten(item)]
              return [value]

          model = torch.jit.load("weights/model.pt", map_location="cpu").eval()
          session = onnxruntime.InferenceSession("detector/element-detector.onnx", providers=["CPUExecutionProvider"])
          names = [o.name for o in session.get_outputs()]

          print("inputs: ", [(i.name, i.shape) for i in session.get_inputs()])
          print("outputs:", [(o.name, o.shape) for o in session.get_outputs()])

          torch.manual_seed(0)
          for height, width in [(640, 640), (1088, 1920)]:
              image = torch.rand(1, 3, height, width)

              with torch.no_grad():
                  expected = [x.numpy() for x in flatten(model(image))]

              started = time.perf_counter()
              actual = session.run(None, {"images": image.numpy()})
              seconds = time.perf_counter() - started

              if len(expected) != len(actual):
                  sys.exit(f"{width}x{height}: PyTorch gave {len(expected)} outputs, the copy {len(actual)}")

              for name, e, a in zip(names, expected, actual):
                  if e.shape != a.shape:
                      sys.exit(f"{width}x{height} {name}: {e.shape} from PyTorch, {a.shape} from the copy")

                  difference = float(numpy.abs(e - a).max())
                  allowed = 1e-3 * max(1.0, float(numpy.abs(e).max()))
                  print(f"{width}x{height} {name}: largest difference {difference:.6f}")
                  if difference > allowed:
                      sys.exit(f"{width}x{height} {name}: differs by {difference}, more than {allowed}")

              print(f"{width}x{height}: {seconds:.2f}s, ok")
          PY

      - name: Write the licence
        run: |
          {
            echo "OmniParser v2's icon_detect_v3, from https://huggingface.co/$REPO and"
            echo "https://github.com/microsoft/OmniParser, is licensed under the MIT License:"
            echo
            cat weights/LICENSE
          } > detector/OmniParser.LICENSE.txt

      # Never "Latest": the app's updater reads latest.yml from whichever release is.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sums=$(cd detector && sha256sum *)

          gh release create "${{ inputs.tag }}" detector/* \
            --latest=false \
            --title "Element detector ${{ inputs.tag }}" \
            --notes "OmniParser v2's \`icon_detect_v3\` (MIT, Copyright Microsoft) from \`$REPO\` at revision \`$REVISION\`, exported from TorchScript to ONNX with PyTorch $TORCH (opset 17, height and width free) and checked against the original with ONNX Runtime $ONNXRUNTIME. The build downloads it (\`npm run models\`).

          SHA-256:

          \`\`\`
          $sums
          \`\`\`"
