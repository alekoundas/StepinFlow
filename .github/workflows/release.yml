name: Release

# A Run button. Pick the bump, and the next number is worked out from the newest v* tag: the tag is
# the one place a version lives. package.json in git says 0.0.0-dev and is stamped here, never
# committed. The release lands as a draft with the latest.yml the updater reads, and publishing the
# draft is the release.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch is fixes, minor is anything new, major is something that stops working"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    # Windows only while the backend targets net10.0-windows and has no other platform layer.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every tag, to work out the next number

      # Only an X.Y.Z tag counts, so the old v0.1.0-build16 and v13 are passed over.
      - name: Work out the version
        id: version
        run: |
          latest=$(git tag --list 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)
          IFS=. read -r major minor patch <<< "${latest:-0.0.0}"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"

          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is tagged already."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install
        run: |
          npm ci
          npm ci --prefix frontend

      # A model never changes under its release tag, and the tags are listed in the download
      # script, so a cache keyed on that script is never stale.
      - name: Restore the models
        uses: actions/cache@v6
        with:
          path: backend/Core/AiModels
          key: models-${{ hashFiles('scripts/download-models.mjs') }}

      - name: Download the models missing
        run: npm run models

      # Read by Electron's version for the updater, and by App.csproj for the backend's.
      - name: Stamp the version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      # The tests that need a live desktop are left out by default.
      - name: Backend tests
        run: npm run test:backend

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Tagged before publishing, so the draft's tag is the commit that was built rather than
      # wherever main is when the draft is published.
      - name: Tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # electron-builder starts two uploads at once, and each creates a draft if it finds none, which
      # splits the files between them. A draft already there is the one they both use.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.version }}" --draft --verify-tag --title "${{ steps.version.outputs.version }}"

      - name: Package and publish a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

      - name: Check the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release.mjs "v${{ steps.version.outputs.version }}"
