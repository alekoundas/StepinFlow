name: Publish OCR models

# PaddleOCR's PP-OCRv5 models (Apache-2.0), from PaddlePaddle's own ONNX exports on HuggingFace, in
# a release of the app's own. The build downloads the line finder and the Latin reader from it
# (scripts/download-models.mjs); the app downloads the other readers from it when Settings asks.
# Run once; a new set means a new tag, and Core/Catalogs/OcrReaderCatalog.cs pointing at it.
#
# Every revision is pinned and every model checked against the SHA-256 the app's catalog holds, so
# the app accepts exactly what this publishes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. A new set of models means a new tag - ocr-v2, ocr-v3."
        required: true
        default: "ocr-v1"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ inputs.tag }} already exists. Use a new tag."
            exit 1
          fi

      # name, HuggingFace repository, revision, SHA-256 of inference.onnx. The same hashes as
      # OcrReaderCatalog. The line finder has no character list.
      - name: Download from HuggingFace
        run: |
          mkdir -p ocr
          while read -r name repo revision sha; do
            [ -z "$name" ] && continue
            base="https://huggingface.co/PaddlePaddle/$repo/resolve/$revision"

            file="ocr/ocr-reader-$name"
            [ "$name" = "line-finder" ] && file="ocr/ocr-line-finder"

            curl --fail --location --show-error --silent -o "$file.onnx" "$base/inference.onnx"
            echo "$sha  $file.onnx" | sha256sum --check --strict

            if [ "$name" != "line-finder" ]; then
              curl --fail --location --show-error --silent -o "$file.yml" "$base/inference.yml"
            fi
          done <<'MODELS'
          line-finder PP-OCRv5_mobile_det_onnx e6f4fa85f00e168c862bc462aebca69eef9b3d3d a431985659dc921974177a95adcfbb90fd9e51989a5e04d70d0b75f597b6e61d
          latin latin_PP-OCRv5_mobile_rec_onnx 89d3a50e2c27e2e7cceeab0e944c25c807d5db4f 7888113072263cb471b93f66dd5e2ad70548dc526fa1ace760d0d973dd121498
          greek el_PP-OCRv5_mobile_rec_onnx 8152b89d2ee0e1d4c92decab75fe75e5e3d836b6 2acf17fcaea2bc81b878e311e6263b8885f48bb03796f75f9f30ed3242bbaa6d
          eslav eslav_PP-OCRv5_mobile_rec_onnx 9a32171fc5718746875e1a261818884517975013 b3018ef2b09a0250b6e0c8e871c927098363e5fd4df890cc68e8358eb0aaf1bd
          cyrillic cyrillic_PP-OCRv5_mobile_rec_onnx 2cef88145434beb8afa9dd82d77d799eb1ad7b29 5371ee1ddaa7983cc62d0818d99e982b6804638c85e4f960d59a574094e172e5
          chinese PP-OCRv5_mobile_rec_onnx ed152b8b495f84de93cda5709d768548a9127622 da72dc72ca4dc220df0dfde68c1dedc31c58d3e76a25871122e5056227d50092
          korean korean_PP-OCRv5_mobile_rec_onnx 5c6f574b8e2230adf4287b33e736d71b9fabd28e 92f0b7785e64fc9090106a241cf4c1eb97472824558272751b88a2a4476d3a08
          arabic arabic_PP-OCRv5_mobile_rec_onnx 14aaedcd75825982689ecf5cd64ab33ee083215a 799113ebf267fbe742deb99eb36e8d42c9ddc5291ceacf92add41b4d52a59110
          devanagari devanagari_PP-OCRv5_mobile_rec_onnx 251aec19e36739540d35e2cc943f6aa7503b98e5 cb789212ce96c69d3e74728ae4309d179281d68cb3945d0616b67cafab41c986
          thai th_PP-OCRv5_mobile_rec_onnx 1d4adbbafb1034a2fd6618498575b81ea7b69f69 27618be66018f8598ac0a526a593f9f1cebf794e7eded93428e8fb016e537f5f
          tamil ta_PP-OCRv5_mobile_rec_onnx 0db89798af0d5218fad9ea7ace0557526e9077f1 c6d2b682d2a0ea4cb1fccdba295976f93fd439964d16cdc666cadef531accbee
          telugu te_PP-OCRv5_mobile_rec_onnx f1197c83430241c58c64b0952b3a80366d04eeba 8238bfc46d4cffe720ed6706e3842802467343497428693ff2bfb4e6b3caa36b
          MODELS

          ls -l ocr

      # The app reads a reader's character list from its inference.yml and refuses one that does
      # not fit the model: the list, plus CTC's blank and a space, is how many characters it tells apart.
      - name: Smoke test the models
        run: |
          pip install --quiet onnxruntime numpy pyyaml
          python - <<'PY'
          import glob, sys
          import numpy, onnxruntime, yaml

          finder = onnxruntime.InferenceSession("ocr/ocr-line-finder.onnx", providers=["CPUExecutionProvider"])
          heat = finder.run(None, {finder.get_inputs()[0].name: numpy.zeros((1, 3, 64, 96), dtype=numpy.float32)})[0]
          print("line finder: heat map", heat.shape)

          for model in sorted(glob.glob("ocr/ocr-reader-*.onnx")):
              name = model[len("ocr/ocr-reader-"):-len(".onnx")]

              with open(f"ocr/ocr-reader-{name}.yml", encoding="utf-8") as f:
                  characters = yaml.safe_load(f)["PostProcess"]["character_dict"]

              session = onnxruntime.InferenceSession(model, providers=["CPUExecutionProvider"])
              out = session.run(None, {session.get_inputs()[0].name: numpy.zeros((1, 3, 48, 320), dtype=numpy.float32)})[0]
              if out.shape[-1] != len(characters) + 2:
                  sys.exit(f"{name}: the model tells {out.shape[-1]} apart, the list has {len(characters)} + 2")

              print(f"{name}: {len(characters)} characters, ok")
          PY

      - name: Write the licence
        run: |
          {
            echo "PaddleOCR's PP-OCRv5 models, from https://huggingface.co/PaddlePaddle and"
            echo "https://github.com/PaddlePaddle/PaddleOCR, are licensed under the Apache License 2.0:"
            echo
            curl --fail --location --show-error --silent https://www.apache.org/licenses/LICENSE-2.0.txt
          } > ocr/PaddleOCR.LICENSE.txt

      # Never "Latest": the app's updater reads latest.yml from whichever release is.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sums=$(cd ocr && sha256sum *)

          gh release create "${{ inputs.tag }}" ocr/* \
            --latest=false \
            --title "OCR models ${{ inputs.tag }}" \
            --notes "PaddleOCR PP-OCRv5 (Apache-2.0): the small line finder and a reader per script, from PaddlePaddle's ONNX exports on HuggingFace at pinned revisions.

          The build downloads the line finder and the Latin reader (\`npm run models\`); the app downloads the other readers from here when Settings asks.

          SHA-256:

          \`\`\`
          $sums
          \`\`\`"
